services:
  postgres:
    image: postgres:16-alpine
    container_name: spiritualhomeo-postgres
    restart: always
    environment:
      POSTGRES_USER: spiritualhomeo
      POSTGRES_PASSWORD: spiritualhomeo_password
      POSTGRES_DB: spiritualhomeo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

